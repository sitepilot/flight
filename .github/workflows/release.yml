name: Release

# Fires when a release is published from the GitHub UI. The tag name is the
# version; a leading "v" is stripped before it is baked into the binary, and
# App\Updater\ReleaseAssetStrategy strips it on both sides of the update
# check, so either tag style works.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Check out the released tag
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, openssl, pcntl
          coverage: none

      # app:build only switches the app to production mode; it does not strip
      # dev dependencies, and box bundles whatever is in vendor. Installing
      # without them roughly halves the binary.
      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress --no-dev

      - name: Resolve the version from the tag
        id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: echo "value=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Build the binary
        run: php flight app:build flight --build-version=${{ steps.version.outputs.value }} --no-interaction

      - name: Verify the binary reports the released version
        run: |
          want='${{ steps.version.outputs.value }}'
          built=$(./builds/flight --version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          if [ "$built" != "$want" ]; then
            echo "Built version '$built' does not match release '$want'." >&2
            exit 1
          fi

      # The asset must be named "flight": App\Updater\ReleaseAssetStrategy
      # downloads <repo>/releases/download/<tag>/flight. --clobber keeps a
      # re-run idempotent.
      - name: Attach the binary to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload '${{ github.event.release.tag_name }}' builds/flight --clobber
